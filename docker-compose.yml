services:
  mysql:
    image: mysql:8.4
    container_name: delivery-platform-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-delivery_platform}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: delivery-platform-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: production
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      HTTP_ADDR: ":${BACKEND_PORT:-8080}"
      DB_DRIVER: mysql
      DB_DSN: ${DB_DSN:?DB_DSN must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong random string}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      GITLAB_BASE_URL: ${GITLAB_BASE_URL:?GITLAB_BASE_URL must be set}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_DRY_RUN: ${GITLAB_DRY_RUN:?GITLAB_DRY_RUN must be set explicitly}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-系统管理员}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${BACKEND_PORT}/readyz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: delivery-platform-web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_UPSTREAM: "backend:${BACKEND_PORT:-8080}"
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  mysql-data:
